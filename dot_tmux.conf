# Better prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support
set -g mouse on

# Better colors
set -g default-terminal "screen-256color"

# Larger scrollback
set -g history-limit 50000

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Easy window splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Forward copies to the local terminal's clipboard via OSC 52.
# `external` = tmux emits the sequence on copy but ignores OSC 52 sent by
# programs running inside tmux (safer than `on`).
set -g set-clipboard external
set -ga terminal-overrides ',*:Ms=\E]52;c;%p2%s\7'

# Status bar
# set -g status-right '#[fg=green]#(tailscale ip -4) #[fg=white]| %H:%M'

set -g set-titles on
set -g set-titles-string "#S: #W"

# ── Session persistence across reboots (resurrect + continuum) ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore the last saved session when the tmux server starts (e.g. after a reboot)
set -g @continuum-restore 'on'
# Snapshot to disk every 15 minutes
set -g @continuum-save-interval '15'
# Save/restore pane contents and detect running programs
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM — KEEP THIS LINE LAST
run '~/.tmux/plugins/tpm/tpm'
