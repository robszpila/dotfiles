format = """
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[›](bold green)"
error_symbol = "[›](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "*"
staged = "+"
untracked = "?"
stashed = "$"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

# Hide language icons we don't care to see in every prompt
[python]
disabled = true

[nodejs]
disabled = true

[ruby]
disabled = true

[package]
disabled = true
